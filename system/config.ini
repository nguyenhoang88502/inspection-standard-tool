[Search]
; Relative paths resolve against the portable project root.
WeeklyBomFolder=../1. Weekly BOM
MasterCartonPictureFolder=master-carton-pictures
Root1=
Root2=
Root3=

[Files]
; Pattern for BOM workbook filenames
BomPattern=BOM & FORMULA*D365.xlsx
; Flattened historical BOM used to reconstruct Level 1 when weekly files omit BOMLevel.
BomLevelReferencePath=C:\Users\nguyenhoang88502\Desktop\combo children\BOM details_ P. BI Jun 10 26.xlsx

[Launcher]
ForceRebuild=false
ShowConsole=true
; How the BOM data is refreshed at launch when the weekly workbook changed (a per-PC override goes in config.local.ini):
;   ask    = show the Update / Skip dialog (Vietnamese + English), only when a rebuild is actually needed
;   always = rebuild without asking, skip = never rebuild while old data exists (use --update to refresh)
;   daily  = at most one rebuild per day, weekly = at most one per 7 days
UpdateData=ask
